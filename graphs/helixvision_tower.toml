#
# helixVision Deploy Graph — Tower (Minimum Secure Transport)
#
# Usage: biomeos deploy --graph graphs/helixvision_tower.toml

[graph]
name = "helixvision_tower"
description = "helixVision — secure transport foundation"
version = "0.1.0"
coordination = "sequential"

[graph.metadata]
security_model = "btsp_enforced"
secure_by_default = true
transport = "uds_only"
tcp_ports = 0
owner = "helixVision"
pattern = "deploy"
proto_nucleate = "primalSpring/graphs/downstream/downstream_manifest.toml"
particle_profile = "electron_heavy"
science_domain = "genomics"
composition_model = "nucleated"
fragments = ["tower_atomic"]
product = "helixvision"
tier = 1

[graph.bonding_policy]
bond_type = "Metallic"
trust_model = "InternalNucleus"
tower_internal = "covalent"
encryption_tiers.tower = "full"

[[graph.nodes]]
name = "beardog"
binary = "beardog"
order = 1
required = true
spawn = false
health_method = "health.liveness"
by_capability = "security"

[[graph.nodes]]
name = "songbird"
binary = "songbird"
order = 2
required = true
spawn = false
depends_on = ["beardog"]
health_method = "health.liveness"
by_capability = "discovery"
